[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nexus-ipc"
version = "0.1.0"
description = "Python SDK for Nexus-IPC."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Nexus Contributors" }]
dependencies = [
  "grpcio>=1.66",
  "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "build>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["nexus_ipc"]

[tool.ruff]
line-length = 100
target-version = "py310"

